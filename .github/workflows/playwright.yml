name: Playwright Tests
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request: null
  workflow_dispatch: null

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      GITHUB_ID: ci-github-client
      GITHUB_SECRET: ci-github-secret
      NEXTAUTH_SECRET: ci-nextauth-secret-for-browser-tests
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_SUBSCRIPTION_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET_KEY: whsec_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - name: Install dependencies
        run: npm i
      - name: Install playwright browsers
        run: npx playwright install --with-deps
      - name: Run tests
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
